<!DOCTYPE html>
<html>
    <head>
        <style>
            @keyframes example{
                0% {background-color:bisque}
                25% {background-color:whitesmoke}
                50% {background-color:yellowgreen}
            }
            div {
                animation-name: example;
                animation-duration: 5s;
            }
        </style>
    </head>
    <body>
        <div>
            Princesses
        </div>
    </body>
</html>
